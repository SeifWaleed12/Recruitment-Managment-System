spring:
  application:
    name: recruitment-platform
  profiles:
    active: dev
  mail:
    host: localhost
    port: 1025
    protocol: smtp
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  ldap:
    embedded:
      port: 8389
      base-dn: dc=banquemisr,dc=com
      ldif: classpath:users.ldif

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# OpenAPI / Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

# Custom Application Security & JWT Configuration Properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 300000
    refresh-token-expiration-ms: 86400000
    reset-token-expiration-ms: 900000
  cv:
    storage-dir: ${CV_STORAGE_DIR:./uploads/cvs}
    max-bulk-files: 20
    allowed-mime-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
  async:
    core-pool-size: 5
    max-pool-size: 20
    queue-capacity: 100
    thread-name-prefix: cv-bulk-async-

# Actuator Health & Metrics Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# LDAP Configuration Properties
ldap:
  urls: ${LDAP_URL:ldap://localhost:8389}
  base: ${LDAP_BASE:dc=banquemisr,dc=com}
  username: ${LDAP_USERNAME:cn=admin,dc=banquemisr,dc=com}
  password: ${LDAP_PASSWORD:adminpassword}
