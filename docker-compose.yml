services:
  postgres:
    image: postgres:16-alpine
    container_name: recruitment_postgres
    environment:
      POSTGRES_DB: recruitment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recruitment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LDAP Directory Server (Bonus Feature Scope)
  openldap:
    image: osixia/openldap:1.5.0
    container_name: recruitment_openldap
    environment:
      LDAP_ORGANISATION: "Banque Misr"
      LDAP_DOMAIN: "banquemisr.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
    ports:
      - "389:389"
      - "636:636"

volumes:
  postgres_data:
